name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/input android/app/src/main/assets/data android/app/src/main/assets/public/images
          cp index.html manifest.webmanifest icon.svg android/app/src/main/assets/
          cp data/seed.json android/app/src/main/assets/data/
          cp public/images/* android/app/src/main/assets/public/images/
          if [ -f input/logo.png ]; then cp input/logo.png android/app/src/main/assets/input/; fi
          if [ -f input/logo.jpg ]; then cp input/logo.jpg android/app/src/main/assets/input/; fi
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vishnu-hardwear-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

